<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 336 410" role="img" aria-label="Vanilla 28">
  <defs>
    <radialGradient id="halo" cx="50%" cy="48%" r="60%">
      <stop offset="0" stop-color="#7a4416" stop-opacity=".75"/>
      <stop offset=".45" stop-color="#2a160a" stop-opacity=".9"/>
      <stop offset="1" stop-color="#050302"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" x2="1">
      <stop offset="0" stop-color="#5a2e10"/>
      <stop offset=".18" stop-color="#c47a32"/>
      <stop offset=".5" stop-color="#e8a858"/>
      <stop offset=".82" stop-color="#b06a26"/>
      <stop offset="1" stop-color="#4a250c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#6e5228"/>
      <stop offset=".3" stop-color="#f8d898"/>
      <stop offset=".55" stop-color="#c89850"/>
      <stop offset=".8" stop-color="#f0c070"/>
      <stop offset="1" stop-color="#6e5228"/>
    </linearGradient>
    <linearGradient id="podium" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#1a140e"/>
      <stop offset="1" stop-color="#050403"/>
    </linearGradient>
    <filter id="smoke" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".012 .03" numOctaves="3" seed="28"/>
      <feDisplacementMap in="SourceGraphic" scale="22"/>
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect width="336" height="410" fill="url(#halo)"/>
  <g filter="url(#smoke)" fill="none" stroke="#f0c070" stroke-opacity=".3" stroke-width="10">
    <path d="M40 360 C 30 280, 80 240, 60 160 S 70 60, 50 10"/>
    <path d="M296 360 C 310 280, 255 230, 280 150 S 270 60, 292 10"/>
  </g>
  <!-- podium -->
  <ellipse cx="168" cy="372" rx="132" ry="22" fill="#000" opacity=".6"/>
  <path d="M38 340 v26 a130 20 0 0 0 260 0 v-26 z" fill="url(#podium)"/>
  <ellipse cx="168" cy="340" rx="130" ry="20" fill="#16110b" stroke="#c89850" stroke-opacity=".45"/>
  <path d="M70 336 l30 6 l25 -9 M200 346 l28 -10 l35 4" stroke="#c89850" stroke-opacity=".35" fill="none"/>
  <!-- bottle -->
  <rect x="146" y="88" width="44" height="22" rx="2" fill="url(#gold)"/>
  <rect x="134" y="44" width="68" height="48" rx="4" fill="url(#gold)"/>
  <rect x="134" y="86" width="68" height="4" fill="#3a2a14" opacity=".5"/>
  <rect x="100" y="108" width="136" height="226" rx="16" fill="url(#glass)"/>
  <rect x="100" y="108" width="136" height="226" rx="16" fill="none" stroke="#f8e0b0" stroke-opacity=".35"/>
  <rect x="110" y="120" width="10" height="200" rx="5" fill="#fff" opacity=".18"/>
  <!-- label -->
  <rect x="122" y="176" width="92" height="96" rx="3" fill="#0a0705"/>
  <rect x="126" y="180" width="84" height="88" rx="2" fill="none" stroke="#c89850" stroke-opacity=".8"/>
  <text x="168" y="214" text-anchor="middle" font-family="Cinzel, 'Times New Roman', serif" font-size="13" letter-spacing="2" fill="#f0c070">VANILLA</text>
  <text x="168" y="246" text-anchor="middle" font-family="Cinzel, 'Times New Roman', serif" font-size="26" fill="#f8d898">28</text>
  <line x1="150" y1="256" x2="186" y2="256" stroke="#c89850" stroke-opacity=".7"/>
</svg>
