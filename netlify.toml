# Configuration Netlify — site statique, aucune étape de build.
[build]
  publish = "."
  command = ""

# En-têtes de sécurité pour toutes les pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# Polices et images : mises en cache une semaine par les navigateurs
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Adresse courte pour les mentions légales
[[redirects]]
  from = "/mentions-legales"
  to = "/mentions-legales.html"
  status = 200
