<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page introuvable — Maison Minuit</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/png" href="/assets/img/favicon.png">
  <link rel="stylesheet" href="/assets/css/fonts.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    .lost { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; text-align: center; padding: 40px var(--gutter); }
    .lost img { width: 120px; height: 120px; margin: 0 auto 24px; animation: fadeIn 1.6s var(--ease-silk) backwards; }
    .lost h1 { font-family: var(--f-display); font-size: clamp(1.4rem, 5vw, 2.2rem); letter-spacing: .16em; text-transform: uppercase; color: var(--or-vif); }
    .lost p { font-family: var(--f-serif); font-style: italic; font-size: 1.2rem; color: var(--texte); margin: 16px 0 32px; }
  </style>
</head>
<body>
  <main class="lost">
    <div>
      <img src="/assets/img/logo-monogram-lg.webp" alt="" width="120" height="120">
      <h1>Page introuvable</h1>
      <p>Ce sillage s’est dissipé dans la nuit.</p>
      <a class="btn btn--gold" href="/"><span>Retour à l’accueil</span></a>
    </div>
  </main>
</body>
</html>
